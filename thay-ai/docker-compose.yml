services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./teachers:/app/teachers   # file các thầy — sửa ở ngoài, không cần build lại
      - ./data:/app/data           # sổ ghi nhớ của các thầy
    expose:
      - "3000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:
